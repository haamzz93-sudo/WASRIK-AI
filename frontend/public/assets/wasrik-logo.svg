<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Corporate BPJS Green Gradient -->
    <linearGradient id="bpjsGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A852" />
      <stop offset="60%" stop-color="#00883E" />
      <stop offset="100%" stop-color="#006930" />
    </linearGradient>

    <!-- Tech Teal Accent -->
    <linearGradient id="cyberTealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Golden Badge Hue -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Drop Shadow for Emblem -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM ==================== -->
  <g transform="translate(15, 10)" filter="url(#subtleShadow)">
    <!-- Base Hexagonal Shield (Kedaulatan Pengawasan JKN) -->
    <path d="M 50 4 
             C 74 4, 94 14, 94 36 
             C 94 65, 68 88, 50 96 
             C 32 88, 6 65, 6 36 
             C 6 14, 26 4, 50 4 Z" 
          fill="url(#bpjsGreenGrad)" />

    <!-- Inner Protective Contour Line -->
    <path d="M 50 10 
             C 70 10, 87 19, 87 37 
             C 87 61, 65 82, 50 89 
             C 35 82, 13 61, 13 37 
             C 13 19, 30 10, 50 10 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.25" 
          stroke-width="1.5" />

    <!-- Left Wing: Indonesian Health Leaf Contour (Daun JKN) -->
    <path d="M 50 20 
             C 35 28, 24 45, 26 62 
             C 31 71, 40 78, 50 85 
             C 45 72, 42 58, 45 42 
             C 47 34, 49 26, 50 20 Z" 
          fill="url(#cyberTealGrad)" 
          opacity="0.9" />

    <!-- Central Stylized 'W' & Neural Intelligence Network -->
    <!-- W Left Stem -->
    <path d="M 33 34 L 41 64 L 46 64 L 41 34 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- W Center Peak & Neural Node -->
    <path d="M 46 64 L 50 46 L 54 64 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="50" cy="42" r="3.5" fill="url(#goldAccent)" stroke="#FFFFFF" stroke-width="1" />

    <!-- W Right Stem with Compliance Verification Check Hook -->
    <path d="M 59 34 L 54 64 L 59 64 L 67 34 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Verification Checkmark Arc Floating Over the Shield -->
    <path d="M 58 54 L 66 62 L 80 44" 
          fill="none" 
          stroke="url(#goldAccent)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Data Intelligence Nodes (Audit Grid) -->
    <circle cx="28" cy="46" r="2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="72" cy="46" r="2" fill="#FFFFFF" opacity="0.8" />
    <line x1="28" y1="46" x2="35" y2="40" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
    <line x1="65" y1="40" x2="72" y2="46" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(130, 24)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#0F172A">
      WASRIK<tspan fill="#00883E">AGENT</tspan>
    </text>

    <!-- AI Intelligence Pill Badge -->
    <g transform="translate(252, 12)">
      <rect x="0" y="0" width="46" height="26" rx="6" fill="#00883E" />
      <text x="23" y="18" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
        AI
      </text>
    </g>

    <!-- Secondary Institutional Descriptor -->
    <text x="1" y="60" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" letter-spacing="1.2" fill="#475569">
      CORPORATE COMPLIANCE &amp; JKN RISK INTELLIGENCE
    </text>

    <!-- Division / Regulatory Tag -->
    <g transform="translate(1, 72)">
      <circle cx="4" cy="5" r="3" fill="#00A852" />
      <text x="13" y="8" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="10" letter-spacing="0.4" fill="#64748B">
        Sistem Pengawasan &amp; Pemeriksaan Kepatuhan Pemberi Kerja • BPJS Kesehatan
      </text>
    </g>
  </g>
</svg>
